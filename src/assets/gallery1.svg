<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="1" stop-color="#d1ecff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#1d73ff"/>
      <stop offset="1" stop-color="#64b7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#g1)"/>

  <!-- Classroom background shapes -->
  <rect x="60" y="120" width="1080" height="520" rx="20" fill="#ffffff"/>
  <g transform="translate(120,180)">
    <!-- Desks -->
    <rect x="0" y="0" width="360" height="220" rx="10" fill="#f4f8ff"/>
    <rect x="420" y="0" width="360" height="220" rx="10" fill="#f4f8ff"/>
    <rect x="840" y="0" width="180" height="220" rx="10" fill="#f4f8ff"/>

    <!-- Monitors -->
    <g fill="#0b2b5a">
      <rect x="30" y="20" width="140" height="90" rx="6"/>
      <rect x="450" y="20" width="140" height="90" rx="6"/>
      <rect x="870" y="20" width="100" height="90" rx="6"/>
    </g>

    <!-- Children (stylized) -->
    <g transform="translate(40,130)">
      <circle cx="30" cy="30" r="28" fill="#ffd9b6"/>
      <rect x="-6" y="60" width="72" height="48" rx="10" fill="#1d73ff"/>
    </g>
    <g transform="translate(470,130)">
      <circle cx="30" cy="30" r="28" fill="#ffe9c8"/>
      <rect x="-6" y="60" width="72" height="48" rx="10" fill="#7cc0ff"/>
    </g>
    <g transform="translate(900,130)">
      <circle cx="22" cy="22" r="22" fill="#ffd9b6"/>
      <rect x="-6" y="50" width="56" height="48" rx="10" fill="#64b7ff"/>
    </g>
  </g>

  <!-- Title badge -->
  <g transform="translate(90,40)">
    <rect width="420" height="76" rx="38" fill="url(#g2)"/>
    <text x="210" y="48" font-family="Inter, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">Interactive Learning</text>
  </g>
</svg>